name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # pytest.ini 默认 -m "not slow",不需要 LLM key 也能跑完
        env:
          ENABLE_MEMORY: "false"
          LANGSMITH_TRACING: "false"
        run: pytest -q

      - name: Check knowledge graph integrity
        env:
          ENABLE_MEMORY: "false"
        run: python scripts/check_graph_data.py
